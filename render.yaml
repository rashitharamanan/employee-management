services:
  - type: web
    name: employee-management
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
        value: 3306
      - key: DB_DATABASE
        sync: false
        value: employee_qr
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        sync: false
        value: false
